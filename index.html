<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16324f">
<meta name="description" content="Calendrier des concours de boule lyonnaise en Île-de-France">
<link rel="icon" href="logo.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="logo-180.png?v=2">
<title>Sport Boules Calendrier – Concours de Lyonnaise en Île-de-France</title>
<script>
  /* Thème clair / sombre : choix mémorisé, sinon celui du téléphone */
  (function(){ var t = null; try { t = localStorage.getItem("lyonnaise-theme"); } catch(e){}
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t); })();
</script>
<style>
  :root{--bg:#f3f1ec;--card:#fff;--ink:#1b2430;--muted:#6b7280;--line:#e4e0d7;--primary:#16324f;--accent:#e0702e;--soft:#e7edf4;--head:#16324f;--hasbg:#f7f5f0;--other:#c6c2b9;--syncline:#f2e2b3;color-scheme:light}
  :root[data-theme="dark"]{--bg:#0e141b;--card:#18212c;--ink:#e6ebf1;--muted:#9aa7b6;--line:#2b3746;--primary:#3a73b5;--accent:#e9813f;--soft:#233142;--head:#0b1622;--hasbg:#1f2b38;--other:#4b5767;--syncline:#4a3f1f;color-scheme:dark}
  :root[data-theme="dark"] .nav,:root[data-theme="dark"] .link-btn{color:#cfe0f5}
  :root[data-theme="dark"] .btn.favbtn{background:#3a3016;color:#f3cf6b}
  :root[data-theme="dark"] .warn{background:#3d3214;color:#f3cf6b}
  :root[data-theme="dark"] .sync-msg{color:#f3cf6b}
  :root[data-theme="dark"] .ev{box-shadow:none}
  .theme-btn{position:absolute;top:12px;right:12px;width:40px;height:40px;border:none;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .theme-btn:active{background:rgba(255,255,255,.25)}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  header{background:var(--head);color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header h1{margin:0 48px 0 0;font-size:1.2rem;display:flex;align-items:center;gap:10px}
  header h1 .logo{flex:0 0 auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
  header p{margin:2px 0 0;font-size:.82rem;opacity:.8}
  main{max-width:760px;margin:0 auto;padding:12px 12px 40px}
  .tools{display:flex;gap:8px;margin-bottom:10px}
  .search{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:var(--card);color:var(--ink)}
  .deptbtn{flex:0 0 auto;max-width:45%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:.95rem;background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit}
  .deptbtn.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .deptpanel{position:absolute;right:0;top:calc(100% + 6px);z-index:8;width:260px;max-width:calc(100vw - 24px);background:var(--card);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:6px 0}
  .drow{display:flex;align-items:center;gap:12px;padding:10px 16px;font-size:1rem;cursor:pointer}
  .drow:active{background:var(--soft)}
  .drow input{width:20px;height:20px;accent-color:var(--primary);margin:0}
  .drow:first-child{border-bottom:1px solid var(--line)}
  .dok{display:block;margin:6px 12px 6px auto;border:none;background:var(--primary);color:#fff;font-weight:600;border-radius:9px;padding:8px 18px;font-size:.95rem;cursor:pointer;font-family:inherit}
  select{padding:10px;border:1px solid var(--line);border-radius:10px;font-size:.95rem;background:var(--card);color:var(--ink)}
  .filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.86rem;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:8px 10px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
  .cal-head h2{margin:0;font-size:1rem;text-transform:capitalize}
  .nav{border:none;background:var(--soft);color:var(--primary);width:34px;height:34px;border-radius:9px;font-size:1.15rem;cursor:pointer}
  .link-btn{border:none;background:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:.78rem;padding:0 6px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .dow{text-align:center;font-size:.7rem;color:var(--muted);font-weight:600;padding:2px 0;text-transform:uppercase}
  .day{height:38px;border:none;background:none;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.88rem;cursor:pointer;color:var(--ink);padding:0}
  .day.other{color:var(--other)}
  .day.today{outline:2px solid var(--accent);outline-offset:-2px}
  .day.has{font-weight:700;background:var(--hasbg)}
  .day.sel{background:var(--primary);color:#fff}
  .dots{display:flex;gap:2px;margin-top:2px;height:5px}
  .dot{width:5px;height:5px;border-radius:50%;display:inline-block}
  .list-title{margin:18px 4px 8px;font-size:1rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .list-title small{color:var(--muted);font-weight:400;white-space:nowrap}
  .ev{display:flex;gap:12px;background:var(--card);border-radius:14px;padding:16px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;border-left:5px solid var(--primary)}
  .ev.cancel{opacity:.55}
  .ev.past{opacity:.6}
  .sync{background:var(--card);border-radius:14px;padding:14px 16px;margin:0 0 12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--syncline)}
  .sync-top{font-weight:700;font-size:1rem}
  .sync-code{font-size:1.9rem;font-weight:800;letter-spacing:.12em;color:var(--primary);margin:6px 0 2px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .sync-help{font-size:.88rem;color:var(--muted);margin:6px 0 10px;line-height:1.45}
  .sync-msg{font-size:.88rem;font-weight:600;color:#8a5a00;margin:4px 0 8px}
  .sync-btns{display:flex;flex-wrap:wrap;gap:8px}
  .sbtn{border:none;border-radius:10px;padding:9px 14px;font-size:.92rem;font-weight:600;cursor:pointer;background:var(--primary);color:#fff;font-family:inherit}
  .sbtn.ghost{background:var(--soft);color:var(--primary)}
  .sync-input{width:100%;background:var(--card);color:var(--ink);padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:1.3rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .clublink{border:none;background:none;padding:0;font:inherit;color:var(--primary);font-weight:600;text-decoration:underline;cursor:pointer;text-align:left}
  :root[data-theme="dark"] .clublink{color:#9cc4f2}
  .clubbox .back{border:none;background:var(--soft);color:var(--ink);border-radius:9px;padding:7px 12px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;margin-bottom:10px}
  .club-name{font-size:1.35rem;font-weight:800;margin-bottom:6px}
  .club-name span{font-weight:400;color:var(--muted)}
  .club-line{font-size:.95rem;margin:4px 0;color:var(--ink)}
  .club-line a{color:inherit}
  .clubbox .btn{margin-top:10px}
  .btn.agbtn{background:var(--primary);color:#fff;border:none;font-size:1rem;cursor:pointer;font-family:inherit}
  .agchoix{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
  .ag{display:block;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;font:inherit;font-size:.98rem;font-weight:600;text-decoration:none;cursor:pointer}
  .sortbar{display:flex;align-items:center;gap:6px;margin:-2px 4px 10px;font-size:.82rem;color:var(--muted)}
  .sortbar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:.82rem;cursor:pointer}
  .sortbar button.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .dept-band{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;padding:8px 14px;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;font-size:.95rem}
  .dept-band:first-child{margin-top:0}
  .dept-band small{background:rgba(255,255,255,.2);border-radius:999px;padding:2px 9px;font-weight:600}
  .past-title{margin:18px 4px 8px;font-size:.9rem;color:var(--muted);font-weight:600}
  .ev-date .yr{display:block;font-size:.7rem;color:var(--muted)}
  .hidden{display:none !important}
  .ev.cancel h3{text-decoration:line-through}
  .ev-date{flex:0 0 52px;text-align:center}
  .ev-date b{display:block;font-size:1.7rem;line-height:1}
  .ev-date span{font-size:.8rem;color:var(--muted);text-transform:uppercase}
  .ev-body{min-width:0;flex:1}
  .fav{flex:0 0 auto;align-self:center;border:none;background:none;font-size:1.8rem;line-height:1;cursor:pointer;color:#c9c4b8;padding:6px 2px 6px 6px}
  .fav.on{color:#f2a900}
  .chip.favchip.on{background:#f2a900;border-color:#f2a900;color:#fff}
  .day{position:relative}
  .day.favday::after{content:"★";position:absolute;top:2px;right:4px;font-size:.62rem;color:#f2a900}
  .day.sel.favday::after{color:#ffd34d}
  .btn.favbtn{background:#fff4d6;color:#8a5a00;border:none;font-size:1rem;cursor:pointer;font-family:inherit}
  .ev h3{margin:0 0 5px;font-size:1.15rem}
  .meta{font-size:.95rem;color:var(--muted);line-height:1.5}
  .tag{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff;margin-right:5px;vertical-align:1px}
  .warn{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:6px;background:#fdecc8;color:#8a5a00;margin-left:4px}
  .empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:.92rem}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .modal.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 18px 28px;max-height:88vh;overflow:auto;animation:up .2s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  @media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
  .sheet h3{margin:8px 0 12px;font-size:1.2rem}
  .row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.93rem}
  .row b{flex:0 0 105px;color:var(--muted);font-weight:600}
  .row a{color:var(--primary)}
  .close{float:right;border:none;background:var(--soft);border-radius:50%;width:36px;height:36px;font-size:1.1rem;cursor:pointer}
  .btn{display:inline-block;margin:14px 8px 0 0;background:var(--accent);color:#fff;text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:600}
  .btn.waze{background:#33ccff;color:#062a3a;display:inline-flex;align-items:center;gap:8px;padding:7px 16px 7px 8px;vertical-align:top}
  .btn.waze img{display:block;border-radius:6px}
  .btn.alt{background:var(--soft);color:var(--primary)}
  footer{text-align:center;font-size:.75rem;color:var(--muted);margin-top:24px;line-height:1.6}
  .loading{text-align:center;padding:40px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <button class="theme-btn" id="themeBtn" aria-label="Mode sombre" title="Mode sombre / clair">🌙</button>
  <h1><img src="logo.png?v=2" alt="Sport Boules Calendrier" width="46" height="46" class="logo">Sport Boules Calendrier</h1>
  <p id="sub">Île-de-France</p>
</header>

<main>
  <div class="tools" style="position:relative">
    <input class="search" id="q" type="search" placeholder="Club, ville, challenge…" aria-label="Rechercher">
    <button class="deptbtn" id="deptBtn" aria-expanded="false" aria-controls="deptPanel">Tous dép. ▾</button>
    <div class="deptpanel hidden" id="deptPanel" role="group" aria-label="Départements"></div>
  </div>
  <div class="filters" id="filters"></div>

  <section class="card" id="calCard">
    <div class="cal-head">
      <button class="nav" id="prev" aria-label="Mois précédent">‹</button>
      <div style="text-align:center">
        <h2 id="month"></h2>
        <button class="link-btn" id="todayBtn">Aujourd'hui</button>
      </div>
      <button class="nav" id="next" aria-label="Mois suivant">›</button>
    </div>
    <div class="grid" id="grid"><div class="loading" style="grid-column:1/-1">Chargement…</div></div>
  </section>

  <div class="list-title"><span id="listTitle"></span><small id="listCount"></small></div>
  <div class="sortbar" id="sortBar"><span>Trier par</span><button data-s="dept">Département</button><button data-s="date">Date</button></div>
  <div id="clubBox" class="sync clubbox hidden"></div>
  <div id="favSync" class="sync hidden"></div>
  <div id="list"></div>

  <footer id="foot"></footer>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="version.js"></script>
<script src="common.js"></script>
<script>
let DATA = { concours: [] };
const today = new Date(); today.setHours(0,0,0,0);
let view = new Date(today.getFullYear(), today.getMonth(), 1);
let selected = null, query = "", favMode = false, clubKey = "";

/* ---------- Catégories affichées : plusieurs possibles, mémorisées dans le navigateur ---------- */
const CAT_KEY = "lyonnaise-categories";
let cats = new Set();
try { cats = new Set(JSON.parse(localStorage.getItem(CAT_KEY) || "[]").filter(k => k in CATS)); } catch {}
function saveCats(){ try { localStorage.setItem(CAT_KEY, JSON.stringify([...cats])); } catch {} }
// Identifiant du club d'un concours (club de la base, sinon lieu libre)
const clubKeyOf = c => (c.db && c.db.club_id) ? c.db.club_id : (c.club ? "lieu:" + c.club + "|" + (c.dept || "") : "");

/* ---------- Départements choisis : plusieurs possibles, mémorisés dans le navigateur ---------- */
const DEPT_KEY = "lyonnaise-departements";
let depts = new Set();
try { depts = new Set(JSON.parse(localStorage.getItem(DEPT_KEY) || "[]").filter(d => DEPTS.includes(d))); } catch {}
function saveDepts(){ try { localStorage.setItem(DEPT_KEY, JSON.stringify([...depts])); } catch {} }
// Les épreuves hors Île-de-France ou sans département (nationales…) restent toujours visibles
/* ---------- Tri de la liste : par département (bandeaux) ou par date, mémorisé ---------- */
const SORT_KEY = "lyonnaise-tri";
let sortMode = "dept";
try { sortMode = localStorage.getItem(SORT_KEY) || "dept"; } catch {}
const deptRang = c => { const i = DEPTS.indexOf(c.dept); return i >= 0 ? i : 99; };
const DEPT_NOMS = { "75":"Paris", "77":"Seine-et-Marne", "78":"Yvelines", "91":"Essonne", "92":"Hauts-de-Seine", "93":"Seine-Saint-Denis", "94":"Val-de-Marne", "95":"Val-d'Oise" };
const deptOk = c => !depts.size || !DEPTS.includes(c.dept) || depts.has(c.dept);

/* ---------- Favoris : mémorisés dans le navigateur du visiteur ---------- */
const FAV_KEY = "lyonnaise-favoris";
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]")); } catch {}
function saveFavs(){ try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); } catch {} }
function toggleFav(id){ favs.has(id) ? favs.delete(id) : favs.add(id); saveFavs(); planSync(); }

/* ---------- Sauvegarde en ligne des favoris avec un code personnel ---------- */
const CODE_KEY = "lyonnaise-code-favoris";
let favCode = "", syncMode = "", syncMsg = "", syncTimer = null;
try { favCode = localStorage.getItem(CODE_KEY) || ""; } catch {}
const fmtCode = c => c ? c.slice(0, 4) + "-" + c.slice(4) : "";
function setCode(c){ favCode = c; try { c ? localStorage.setItem(CODE_KEY, c) : localStorage.removeItem(CODE_KEY); } catch {} }
async function pushFavs(){
  const sb = sbClient(); if (!sb || !favCode) return;
  const { error } = await sb.rpc("sauver_favoris", { p_code: favCode, p_favoris: [...favs] });
  if (error && /code inconnu/i.test(error.message)) { setCode(""); syncMsg = "Ce code n'existe plus : créez-en un nouveau."; renderSync(); }
}
function planSync(){ if (!favCode) return; clearTimeout(syncTimer); syncTimer = setTimeout(pushFavs, 800); }
async function pullFavs(){
  const sb = sbClient(); if (!sb || !favCode) return;
  const { data, error } = await sb.rpc("charger_favoris", { p_code: favCode });
  if (!error && Array.isArray(data)) { favs = new Set(data); saveFavs(); render(); }
}
function renderSync(){
  const box = document.getElementById("favSync");
  if (!favMode || !sbClient()) { box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  const msg = syncMsg ? `<p class="sync-msg">${esc(syncMsg)}</p>` : "";
  if (favCode && syncMode !== "saisie") {
    box.innerHTML = `<div class="sync-top">☁️ Favoris sauvegardés en ligne</div>
      <div class="sync-code">${fmtCode(favCode)}</div>
      <p class="sync-help">Notez ce code : il permet de retrouver vos favoris sur un autre téléphone ou après avoir vidé votre navigateur. Chaque changement est enregistré automatiquement.</p>${msg}
      <div class="sync-btns"><button class="sbtn" id="sCopy">📋 Copier le code</button><button class="sbtn ghost" id="sOther">Utiliser un autre code</button><button class="sbtn ghost" id="sForget">Arrêter sur ce téléphone</button></div>`;
    document.getElementById("sCopy").onclick = async () => {
      try { await navigator.clipboard.writeText(fmtCode(favCode)); syncMsg = "Code copié ✔"; } catch { syncMsg = "Copie impossible : notez le code à la main."; }
      renderSync();
    };
    document.getElementById("sOther").onclick = () => { syncMode = "saisie"; syncMsg = ""; renderSync(); };
    document.getElementById("sForget").onclick = () => { setCode(""); syncMsg = "Ce téléphone ne sauvegarde plus vos favoris en ligne. Ils restent enregistrés avec votre code."; renderSync(); };
  } else if (syncMode === "saisie") {
    box.innerHTML = `<div class="sync-top">🔑 Retrouver mes favoris</div>
      <p class="sync-help">Tapez le code reçu lors de la sauvegarde. Vos favoris de ce téléphone seront ajoutés aux siens.</p>
      <input id="sInput" class="sync-input" placeholder="ex. K7Q2-M9XD" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false">${msg}
      <div class="sync-btns"><button class="sbtn" id="sLoad">Récupérer</button><button class="sbtn ghost" id="sCancel">Annuler</button></div>`;
    const inp = document.getElementById("sInput"); inp.focus();
    inp.onkeydown = e => { if (e.key === "Enter") document.getElementById("sLoad").click(); };
    document.getElementById("sCancel").onclick = () => { syncMode = ""; syncMsg = ""; renderSync(); };
    document.getElementById("sLoad").onclick = async () => {
      const code = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (code.length !== 8) { syncMsg = "Le code fait 8 caractères, par exemple K7Q2-M9XD."; return renderSync(); }
      const { data, error } = await sbClient().rpc("charger_favoris", { p_code: code });
      if (error) { syncMsg = "Connexion impossible, réessayez dans un instant."; return renderSync(); }
      if (!Array.isArray(data)) { syncMsg = "Code inconnu. Vérifiez les caractères."; return renderSync(); }
      data.forEach(id => favs.add(id)); saveFavs(); setCode(code); syncMode = ""; syncMsg = "Favoris récupérés ✔";
      await pushFavs(); render();
    };
  } else {
    box.innerHTML = `<div class="sync-top">☁️ Ne perdez pas vos favoris</div>
      <p class="sync-help">Ils sont enregistrés sur ce téléphone uniquement. Créez un code pour les sauvegarder en ligne et les retrouver partout, sans compte ni e-mail.</p>${msg}
      <div class="sync-btns"><button class="sbtn" id="sCreate">Créer mon code</button><button class="sbtn ghost" id="sHave">J'ai déjà un code</button></div>`;
    document.getElementById("sCreate").onclick = async () => {
      const { data, error } = await sbClient().rpc("sauver_favoris", { p_code: null, p_favoris: [...favs] });
      if (error || !data) { syncMsg = "Connexion impossible, réessayez dans un instant."; return renderSync(); }
      setCode(data); syncMsg = ""; renderSync();
    };
    document.getElementById("sHave").onclick = () => { syncMode = "saisie"; syncMsg = ""; renderSync(); };
  }
}
const isFav = c => favs.has(c.id);
const pastConcours = c => (c.fin || c.date) < dkey(today);

function filtered(){
  if (clubKey) return DATA.concours.filter(c => clubKeyOf(c) === clubKey);
  const q = query.trim().toLowerCase();
  return DATA.concours.filter(c =>
    (!favMode || isFav(c)) && (!cats.size || cats.has(c.cat)) && deptOk(c) &&
    (!q || [c.nom,c.club,c.dept,c.challenge,c.division,c.formule,c.adresse,c.info,c.systeme].join(" ").toLowerCase().includes(q)));
}

function renderFilters(){
  const el = document.getElementById("filters");
  const opts = [["", "Tout"], ...Object.entries(CATS).map(([k,v]) => [k, v.label])];
  const nFav = DATA.concours.filter(isFav).length;
  el.innerHTML = `<button class="chip favchip ${favMode?"on":""}" id="favChip">★ Mes favoris${nFav?` (${nFav})`:""}</button>` +
    opts.map(([k,l]) =>
    `<button class="chip ${!favMode && (k ? cats.has(k) : !cats.size) ? "on" : ""}" data-c="${k}" aria-pressed="${k ? cats.has(k) : !cats.size}">${k?`<i class="dot" style="background:${CATS[k].color}"></i>`:""}${l}</button>`).join("");
  el.querySelectorAll(".chip[data-c]").forEach(b => b.onclick = () => {
    const k = b.dataset.c;
    if (!k) cats.clear();
    else if (favMode) { cats = new Set([k]); }          // depuis les favoris : on revient au calendrier sur cette catégorie
    else cats.has(k) ? cats.delete(k) : cats.add(k);
    if (cats.size === Object.keys(CATS).length) cats.clear();
    saveCats(); favMode = false; clubKey = ""; selected = null; render();
  });
  document.getElementById("favChip").onclick = () => { favMode = !favMode; clubKey = ""; selected = null; render(); };
}

function renderCalendar(){
  document.getElementById("month").textContent = `${MOIS[view.getMonth()]} ${view.getFullYear()}`;
  const byDay = {};
  filtered().forEach(c => joursDe(c).forEach(k => (byDay[k] ||= []).push(c)));
  const offset = (view.getDay() + 6) % 7;
  const start = new Date(view); start.setDate(1 - offset);
  let html = JOURS.map(j => `<div class="dow">${j}</div>`).join("");
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i >= 35 && d.getMonth() !== view.getMonth()) break;
    const k = dkey(d), evs = byDay[k] || [];
    const cls = ["day", d.getMonth()!==view.getMonth()?"other":"", +d===+today?"today":"", k===selected?"sel":"", evs.length?"has":"", evs.some(isFav)?"favday":""].join(" ");
    const dots = [...new Set(evs.map(e => e.cat))].slice(0,4)
      .map(c => `<i class="dot" style="background:${k===selected?"#fff":(CATS[c]||CATS.pmo).color}"></i>`).join("");
    html += `<button class="${cls}" data-k="${k}" aria-label="${d.getDate()} ${MOIS[d.getMonth()]}${evs.length?`, ${evs.length} concours`:""}">${d.getDate()}<span class="dots">${dots}</span></button>`;
  }
  const grid = document.getElementById("grid");
  grid.innerHTML = html;
  grid.querySelectorAll(".day").forEach(b => b.onclick = () => {
    const k = b.dataset.k, d = parseD(k);
    if (d.getMonth() !== view.getMonth()) view = new Date(d.getFullYear(), d.getMonth(), 1);
    selected = selected === k ? null : k;
    render();
    if (selected) document.getElementById("listTitle").scrollIntoView({behavior:"smooth", block:"start"});
  });
}

function renderList(){
  let items = filtered(), title;
  const listMode = favMode || !!clubKey;
  document.getElementById("calCard").classList.toggle("hidden", listMode);
  if (!favMode || clubKey) document.getElementById("favSync").classList.add("hidden");
  renderClubBox();
  if (clubKey){
    const all = trier(items);
    items = [...all.filter(c => !pastConcours(c)), ...all.filter(pastConcours).reverse()];
    title = "Concours du club";
  } else if (favMode){
    // Tous les favoris, sans lien avec le mois affiché : à venir d'abord, puis les passés
    const all = trier(items);
    items = [...all.filter(c => !pastConcours(c)), ...all.filter(pastConcours).reverse()];
    title = "Mes favoris";
    renderSync();
  } else if (selected){
    items = items.filter(c => joursDe(c).includes(selected));
    title = parseD(selected).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  } else {
    const ym = `${view.getFullYear()}-${pad(view.getMonth()+1)}`;
    items = items.filter(c => joursDe(c).some(k => k.startsWith(ym)));
    title = `${MOIS[view.getMonth()]} ${view.getFullYear()}`;
  }
  if (!listMode) items = trier(items);
  const parDept = !listMode && sortMode === "dept";
  if (parDept) items = items.slice().sort((a, b) => deptRang(a) - deptRang(b) || (a.dept || "").localeCompare(b.dept || ""));  // tri stable : la date reste l'ordre secondaire
  const sb = document.getElementById("sortBar");
  sb.classList.toggle("hidden", listMode);
  sb.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.s === sortMode));
  document.getElementById("listTitle").textContent = title.charAt(0).toUpperCase() + title.slice(1);
  document.getElementById("listCount").textContent = items.length ? `${items.length} concours` : "";
  const list = document.getElementById("list");
  if (!items.length && clubKey){
    list.innerHTML = `<div class="empty">Aucun concours pour ce club.</div>`;
    return;
  }
  if (!items.length && favMode){
    list.innerHTML = `<div class="empty">Aucun favori pour l'instant.<br>Touchez l'étoile ☆ d'un concours pour l'ajouter à vos favoris.</div>`;
    return;
  }
  if (!items.length){
    list.innerHTML = `<div class="empty">Aucun concours ${selected ? "ce jour-là" : "ce mois-ci"}${cats.size||depts.size||query ? " avec ces filtres" : ""}.${selected ? "<br>Touchez à nouveau le jour pour revoir tout le mois." : ""}</div>`;
    return;
  }
  let pastHeader = false, lastDept = null;
  list.innerHTML = items.map(c => {
    const d = parseD(c.date), k = catOf(c);
    const past = listMode && pastConcours(c);
    let sep = past && !pastHeader ? (pastHeader = true, `<div class="past-title">Déjà passés</div>`) : "";
    if (parDept){
      const k = deptRang(c) < 99 ? c.dept : "autres";
      if (k !== lastDept){
        lastDept = k;
        const nom = k === "autres" ? "Hors Île-de-France / national" : `${k} · ${DEPT_NOMS[k] || ""}`;
        sep += `<div class="dept-band"><span>${esc(nom)}</span></div>`;
      }
    }
    const l = lieu(c), f = format(c);
    return sep + `<div class="ev ${c.statut==="Annulé"?"cancel":""} ${past?"past":""}" style="border-left-color:${k.color}" data-id="${esc(c.id)}" tabindex="0" role="button">
      <div class="ev-date"><b>${d.getDate()}</b><span>${listMode ? d.toLocaleDateString("fr-FR",{month:"short"}) : JOURS[(d.getDay()+6)%7]}${c.fin&&c.fin>c.date?"+":""}</span>${listMode ? `<span class="yr">${d.getFullYear()}</span>` : ""}</div>
      <div class="ev-body">
        <h3>${esc(titre(c))}${!c.nom && c.dept ? ` <span style="font-weight:400;color:var(--muted)">(${esc(c.dept)})</span>` : ""}${c.statut?`<span class="warn">${esc(c.statut)}</span>`:""}</h3>
        <div class="meta"><span class="tag" style="background:${k.color}">${esc(k.label)}</span>${esc(f)}</div>
        <div class="meta">${c.nom && l ? "📍 " + esc(l) + " · " : ""}${c.heure ? "🕗 " + esc(c.heure) : ""}${c.systeme ? " · " + esc(c.systeme) : ""}${c.challenge ? " · " + esc(c.challenge) : ""}</div>
      </div>
      <button class="fav ${isFav(c)?"on":""}" data-fav="${esc(c.id)}" aria-label="${isFav(c)?"Retirer des favoris":"Ajouter aux favoris"}" aria-pressed="${isFav(c)}">${isFav(c)?"★":"☆"}</button></div>`;
  }).join("");
  list.querySelectorAll(".fav").forEach(b => b.onclick = ev => { ev.stopPropagation(); toggleFav(b.dataset.fav); render(); });
  list.querySelectorAll(".ev").forEach(e => {
    const open = () => openDetail(DATA.concours.find(c => c.id === e.dataset.id));
    e.onclick = open; e.onkeydown = ev => { if (ev.key === "Enter") open(); };
  });
}

function wazeUrl(c){
  const where = c.adresse || ["boulodrome", c.club, c.dept].filter(Boolean).join(" ");
  return `https://waze.com/ul?q=${encodeURIComponent(where)}&navigate=yes`;
}
/* ---------- Ajout à l'agenda du téléphone ---------- */
function horaires(c){
  // Renvoie {allDay, start:"YYYYMMDD[THHMMSS]", end:...}
  const ymd = d => d.replace(/-/g, "");
  const m = /(\d{1,2})\s*h\s*(\d{2})?/i.exec(c.heure || "");
  if (!m || (c.fin && c.fin > c.date)) {
    const end = parseD(c.fin && c.fin > c.date ? c.fin : c.date); end.setDate(end.getDate() + 1);
    return { allDay: true, start: ymd(c.date), end: dkey(end).replace(/-/g, "") };
  }
  const h = +m[1], mn = +(m[2] || 0);
  const fin = Math.min(h + 8, 23);   // durée indicative de la journée de concours
  return { allDay: false, start: `${ymd(c.date)}T${pad(h)}${pad(mn)}00`, end: `${ymd(c.date)}T${pad(fin)}${pad(mn)}00` };
}
function agendaTexte(c){
  return [format(c), c.systeme, c.challenge, c.tel ? "Tél. " + c.tel : "", c.info, location.origin + location.pathname]
    .filter(Boolean).join("\n");
}
const agendaLieu = c => c.adresse || [c.club, c.dept ? "(" + c.dept + ")" : ""].filter(Boolean).join(" ");
function googleAgendaUrl(c){
  const t = horaires(c);
  const q = new URLSearchParams({ action: "TEMPLATE", text: titre(c) + (c.nom ? "" : " – concours de lyonnaise"),
    dates: t.start + "/" + t.end, details: agendaTexte(c), location: agendaLieu(c), ctz: "Europe/Paris" });
  return "https://calendar.google.com/calendar/render?" + q.toString();
}
function telechargerIcs(c){
  const t = horaires(c);
  const e = v => String(v).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Concours de Lyonnaise//FR", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    `UID:${c.id}@sportboulescalendrier`, `DTSTAMP:${stamp}`,
    t.allDay ? `DTSTART;VALUE=DATE:${t.start}` : `DTSTART:${t.start}`,
    t.allDay ? `DTEND;VALUE=DATE:${t.end}` : `DTEND:${t.end}`,
    `SUMMARY:${e(titre(c) + (c.nom ? "" : " – concours de lyonnaise"))}`,
    `LOCATION:${e(agendaLieu(c))}`, `DESCRIPTION:${e(agendaTexte(c))}`,
    "BEGIN:VALARM", "TRIGGER:-P1D", "ACTION:DISPLAY", "DESCRIPTION:Concours demain", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `concours-${c.date}-${(c.club || "lyonnaise").replace(/[^a-z0-9]+/gi, "-")}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function choixAgenda(c){
  const box = document.getElementById("agendaChoix");
  box.classList.toggle("hidden");
  box.innerHTML = `<button class="ag" id="agIcs">📱 iPhone / Outlook / autre agenda</button>
    <a class="ag" href="${googleAgendaUrl(c)}" target="_blank" rel="noopener">🗓️ Google Agenda (Android)</a>`;
  document.getElementById("agIcs").onclick = () => telechargerIcs(c);
}

function showClub(key){
  clubKey = key; favMode = false; selected = null; closeDetail(); render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function renderClubBox(){
  const box = document.getElementById("clubBox");
  if (!clubKey){ box.classList.add("hidden"); return; }
  const ref = DATA.concours.find(c => clubKeyOf(c) === clubKey);
  if (!ref){ clubKey = ""; box.classList.add("hidden"); return; }
  const tel = ref.clubObj ? ref.clubObj.tel : ref.tel;
  const lignes = [
    ref.adresse ? `📍 ${esc(ref.adresse)}` : "",
    tel ? `📞 <a href="tel:${tel.replace(/\s/g,"")}">${esc(tel)}</a>` : "",
    ref.contact ? `👤 ${esc(ref.contact)}` : "",
    ref.email ? `✉️ <a href="mailto:${esc(ref.email)}">${esc(ref.email)}</a>` : "",
    ref.clubInfo ? `ℹ️ ${esc(ref.clubInfo)}` : "",
  ].filter(Boolean).map(l => `<div class="club-line">${l}</div>`).join("");
  box.classList.remove("hidden");
  box.innerHTML = `<button class="back" id="clubBack">‹ Retour au calendrier</button>
    <div class="club-name">${esc(ref.club)}${ref.dept ? ` <span>(${esc(ref.dept)})</span>` : ""}</div>${lignes}
    <a class="btn waze" href="${wazeUrl(ref)}" target="_blank" rel="noopener"><img src="waze.png" alt="" width="26" height="26">Waze</a>`;
  document.getElementById("clubBack").onclick = () => { clubKey = ""; render(); };
}
function openDetail(c){
  const k = catOf(c);
  const waze = wazeUrl(c);
  const tel = c.tel ? `<a href="tel:${c.tel.replace(/\s/g,"")}">${esc(c.tel)}</a>` : "";
  const rows = [
    ["Date", esc(dateTexte(c))],
    ["Heure", esc(c.heure)],
    ["Club / lieu", c.club ? `<button class="clublink" id="clubLink">${esc([c.club, c.dept ? `(${c.dept})` : ""].filter(Boolean).join(" "))} ›</button>` : ""],
    ["Adresse", esc(c.adresse)],
    ["Type", esc(TYPES[c.type] || c.type)],
    ["Format", esc(format(c))],
    ["Déroulement", esc(c.systeme)],
    ["Challenge", esc(c.challenge)],
    ["Téléphone", tel],
    ["Contact", esc(c.contact)],
    ["E-mail", c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ""],
    ["Le club", esc(c.clubInfo)],
    ["Infos", esc(c.info)],
    ["Statut", c.statut ? `<span class="warn" style="margin:0">${esc(c.statut)}</span>` : ""],
  ].filter(r => r[1]).map(r => `<div class="row"><b>${r[0]}</b><span>${r[1]}</span></div>`).join("");
  document.getElementById("sheet").innerHTML =
    `<button class="close" aria-label="Fermer">✕</button>
     <span class="tag" style="background:${k.color}">${esc(k.label)}</span>
     <h3>${esc(titre(c))}</h3>${rows}
     <button class="btn favbtn" id="favBtn">${isFav(c) ? "★ Dans mes favoris" : "☆ Ajouter aux favoris"}</button>
     <button class="btn agbtn" id="agendaBtn">📅 Ajouter à mon agenda</button><div id="agendaChoix" class="agchoix hidden"></div>
     <a class="btn waze" href="${waze}" target="_blank" rel="noopener"><img src="waze.png" alt="" width="26" height="26">Waze</a>${c.tel ? `<a class="btn alt" href="tel:${c.tel.replace(/\s/g,"")}">📞 Appeler</a>` : ""}`;
  const m = document.getElementById("modal");
  m.classList.add("open");
  m.querySelector(".close").onclick = closeDetail;
  document.getElementById("agendaBtn").onclick = () => choixAgenda(c);
  const cl = document.getElementById("clubLink");
  if (cl) cl.onclick = () => showClub(clubKeyOf(c));
  document.getElementById("favBtn").onclick = () => { toggleFav(c.id); render(); openDetail(c); };
}
function closeDetail(){ document.getElementById("modal").classList.remove("open"); }
document.getElementById("modal").onclick = e => { if (e.target.id === "modal") closeDetail(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

function shift(n){ view = new Date(view.getFullYear(), view.getMonth()+n, 1); selected = null; render(); }
document.getElementById("prev").onclick = () => shift(-1);
document.getElementById("next").onclick = () => shift(1);
document.getElementById("todayBtn").onclick = () => { view = new Date(today.getFullYear(), today.getMonth(), 1); selected = dkey(today); render(); };
document.getElementById("q").oninput = e => { query = e.target.value; selected = null; render(); };
const deptBtn = document.getElementById("deptBtn"), deptPanel = document.getElementById("deptPanel");
function renderDepts(){
  deptBtn.textContent = (depts.size ? [...depts].sort().join(", ") : "Tous dép.") + " ▾";
  deptBtn.classList.toggle("on", depts.size > 0);
  const row = (d, label, on) => `<label class="drow"><input type="checkbox" data-d="${d}" ${on ? "checked" : ""}><span>${label}</span></label>`;
  deptPanel.innerHTML = row("", "Tous les départements", !depts.size) +
    DEPTS.map(d => row(d, `<b>${d}</b> ${DEPT_NOMS[d] || ""}`, depts.has(d))).join("") +
    `<button class="dok" id="deptOk">OK</button>`;
  deptPanel.querySelectorAll("input").forEach(cb => cb.onchange = () => {
    const d = cb.dataset.d;
    if (!d) depts.clear(); else cb.checked ? depts.add(d) : depts.delete(d);
    if (depts.size === DEPTS.length) depts.clear();
    saveDepts(); selected = null; renderDepts(); render();
  });
  document.getElementById("deptOk").onclick = closeDepts;
}
function closeDepts(){ deptPanel.classList.add("hidden"); deptBtn.setAttribute("aria-expanded", "false"); }
deptBtn.onclick = ev => {
  ev.stopPropagation();
  const open = deptPanel.classList.toggle("hidden") === false;
  deptBtn.setAttribute("aria-expanded", open);
};
deptPanel.onclick = ev => ev.stopPropagation();
document.addEventListener("click", closeDepts);
renderDepts();

let tx = null, ty = null;
const gridEl = document.getElementById("grid");
gridEl.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
gridEl.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) shift(dx < 0 ? 1 : -1);
  tx = null;
});

/* ---------- Bouton mode sombre ---------- */
const themeBtn = document.getElementById("themeBtn");
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  themeBtn.setAttribute("aria-label", t === "dark" ? "Passer en mode clair" : "Passer en mode sombre");
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", t === "dark" ? "#0b1622" : "#16324f");
}
applyTheme(document.documentElement.getAttribute("data-theme") || "light");
themeBtn.onclick = () => {
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  try { localStorage.setItem("lyonnaise-theme", t); } catch {}
  applyTheme(t);
};

document.getElementById("sortBar").querySelectorAll("button").forEach(b => b.onclick = () => {
  sortMode = b.dataset.s; try { localStorage.setItem(SORT_KEY, sortMode); } catch {} renderList();
});

function render(){ renderFilters(); renderCalendar(); renderList(); }

function showMeta(maj, secours){
  document.getElementById("sub").textContent = `Île-de-France · Saison ${SAISON}`;
  const v = typeof VERSION === "string" ? `Version ${esc(VERSION)}` : "";
  const d = maj ? `Concours mis à jour le ${esc(new Date(maj).toLocaleDateString("fr-FR"))}` : "";
  document.getElementById("foot").innerHTML =
    [v, d].filter(Boolean).join(" · ") +
    (secours ? `<br><b>Version de secours affichée</b> (base de données momentanément indisponible).` : "");
}
async function load(){
  try {
    const rows = await fetchConcours();
    DATA = { concours: rows };
    pullFavs();
    const maj = rows.reduce((m, r) => r.updated_at > m ? r.updated_at : m, "");
    showMeta(maj, false);
  } catch (e) {
    // Secours : copie statique data.json (si Supabase est en pause ou pas encore configuré)
    try {
      const r = await fetch("data.json?v=" + Date.now(), {cache: "no-store"});
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      DATA = { concours: d.concours.map(normalize) };
      showMeta(d.maj, supabaseConfigured());
    } catch {
      document.getElementById("grid").innerHTML = `<div class="empty" style="grid-column:1/-1">Impossible de charger le calendrier. Réessayez plus tard.</div>`;
      return;
    }
  }
  render();
}
load();
