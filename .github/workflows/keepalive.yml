# Interroge la base Supabase deux fois par semaine pour éviter que le projet
# gratuit soit mis en pause en période creuse (l'été par exemple).
name: Garder Supabase actif
on:
  schedule:
    - cron: "17 6 * * 1,4"   # lundi et jeudi
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lecture d'un concours
        run: |
          URL=$(grep -oP 'SUPABASE_URL\s*=\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'SUPABASE_KEY\s*=\s*"\K[^"]+' config.js)
          curl -fsS "$URL/rest/v1/concours?select=id&limit=1" -H "apikey: $KEY"
